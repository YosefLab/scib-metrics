name: Test (Linux, CUDA)

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, opened]
  schedule:
    - cron: "0 10 * * *" # runs at 10:00 UTC (03:00 PST) every day
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # if PR has label "cuda tests" or "all tests" or if scheduled or manually triggered
    if: >-
      (
        contains(github.event.pull_request.labels.*.name, 'cuda tests') ||
        contains(github.event.pull_request.labels.*.name, 'all tests') ||
        contains(github.event_name, 'schedule') ||
        contains(github.event_name, 'workflow_dispatch')
      )
    runs-on: [self-hosted, Linux, X64, CUDA]
    defaults:
      run:
        shell: bash -e {0} # -e to fail on error

    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
        cuda: ["12"]

    container:
      image: ghcr.io/scverse/scvi-tools:py${{ matrix.python }}-cu${{ matrix.cuda }}-base
      options: --user root --gpus all

    name: Integration (CUDA)

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          pip install --upgrade "pip>=25.1"
          # Pin jax/jaxlib to the versions baked into the base image: it ships a matching
          # jax_cuda12_plugin that isn't installed via pip, so letting the resolver upgrade
          # jax/jaxlib here breaks CUDA initialization.
          JAX_VERSION=$(python -c "import jax; print(jax.__version__)")
          pip install -e . --group dev --group test "jax==${JAX_VERSION}" "jaxlib==${JAX_VERSION}"

      - name: Test
        env:
          MPLBACKEND: agg
          PLATFORM: ${{ matrix.os }}
          DISPLAY: :42
        run: |
          coverage run -m pytest -v --color=yes
      - name: Report coverage
        run: |
          coverage report
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
